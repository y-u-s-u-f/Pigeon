[package]
name = "pigeon"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# gpui-kit re-exports the GPUI snapshot (gpui-pre) that gpui-component is built
# against, so the two never drift apart. Renamed so code (and GPUI macros) say `gpui::`.
gpui = { package = "gpui-kit", version = "0.8", default-features = false, features = ["component"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
anyhow = "1"
# The versions gpui-base already builds, so they add no compile time.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
nucleo-matcher = "0.3"
# Already built for gpui-component's markdown view; turns drafts into HTML.
markdown = "1"
# The backend (docs/BACKEND_SPRINT_1.md, 2.1). Blocking HTTP over the rustls
# and ring GPUI already builds; no async runtime.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# The local cache. Bundled, so it doesn't depend on the system's SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }
# Keychain and SecRandom (PKCE). Already in the lock file.
security-framework = "3.7"
# MIME in and out. Pure Rust.
mail-parser = "1"
mail-builder = "2"
# base64url and the PKCE S256 challenge. Already in the lock file.
base64 = "0.22"
sha2 = "0.10"
# Local ids and client-chosen event ids. Already in the lock file.
uuid = { version = "1", features = ["v4"] }
# The local IANA zone for event writes. Already pulled in by chrono's clock.
iana-time-zone = "0.1"
# Sprint 2 W1: gpui's own log output, into the log file. Already in the lock file.
log = { version = "0.4", default-features = false, features = ["std"] }
# Sprint 2 W1/W7: the Dock badge, wake, the single-instance handoff and the
# menu bar item. The versions gpui's macOS platform already builds.
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDateFormatter",
    "NSFormatter",
    "NSGeometry",
    "NSLocale",
    "NSDictionary",
    "NSBundle",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSError",
    "NSTimeZone",
    "NSURL",
    "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSAccessibility",
    "NSAnimation",
    "NSAnimationContext",
    "NSApplication",
    "NSBezierPath",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSDockTile",
    "NSHapticFeedback",
    "NSEvent",
    "NSImage",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "libc",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
# Polish W1 (MC-092): typed Launch Services, CFString and timing functions,
# all already in the lock file.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "LaunchServices", "LSInfo"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMediaTimingFunction"] }
# W7b: the menu bar's click-away monitor and drawn icon, and the panel's
# NSWindow behind its gpui window. Both already in the lock file.
block2 = "0.6"
raw-window-handle = "0.6"
# SYS-4: the MCP server's HTTP parsing, and its calls to the main thread.
# Both already in the lock file.
httparse = "1"
async-channel = "2"

# MA-011: Increase Contrast appearances; see vendor/gpui-pre-macos/PIGEON_PATCHES.md.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
